name: project-nomad

x-restart: &restart
  restart: unless-stopped

services:
  admin:
    <<: *restart
    image: ${NOMAD_ADMIN_IMAGE}
    pull_policy: never
    container_name: nomad_admin
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 8080:8080
    volumes:
      - ${NOMAD_HOME}/storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NODE_ENV: production
      NOMAD_STORAGE_PATH: ${NOMAD_HOME}/storage
      PORT: 8080
      HOST: 0.0.0.0
      URL: ${NOMAD_URL}
      LOG_LEVEL: info
      APP_KEY: ${NOMAD_APP_KEY}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: nomad
      DB_USER: nomad_user
      DB_PASSWORD: ${NOMAD_DB_PASSWORD}
      DB_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DISABLE_COMPRESSION: "false"
      INTERNET_STATUS_TEST_URL: ${NOMAD_INTERNET_TEST_URL}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/api/health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
      start_interval: 2s

  mysql:
    <<: *restart
    image: ${NOMAD_MYSQL_IMAGE}
    pull_policy: never
    container_name: nomad_mysql
    # No binary log: one server without replication, and it grows by GBs during imports
    command: [--performance-schema=OFF, --innodb-buffer-pool-size=64M, --disable-log-bin]
    environment:
      MYSQL_ROOT_PASSWORD: ${NOMAD_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: nomad
      MYSQL_USER: nomad_user
      MYSQL_PASSWORD: ${NOMAD_DB_PASSWORD}
    volumes:
      - ${NOMAD_HOME}/mysql:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 2m
      start_interval: 1s

  redis:
    <<: *restart
    image: ${NOMAD_REDIS_IMAGE}
    pull_policy: never
    container_name: nomad_redis
    volumes:
      - ${NOMAD_HOME}/redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s

  dozzle:
    <<: *restart
    image: ${NOMAD_DOZZLE_IMAGE}
    pull_policy: never
    container_name: nomad_dozzle
    ports:
      - 9999:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_SHELL: "false"

  disk-collector:
    <<: *restart
    image: ${NOMAD_DISK_COLLECTOR_IMAGE}
    pull_policy: never
    container_name: nomad_disk_collector
    volumes:
      - /:/host:ro,rslave
      - ${NOMAD_HOME}/storage:/storage
