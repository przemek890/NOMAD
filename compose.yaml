name: nomad-box

# Every container: restart after a crash, at most 30 MB of logs
x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  nomad:
    <<: *defaults
    image: ${NOMAD_BOX_IMAGE:-nomad-box:latest}
    container_name: nomad-box
    hostname: nomad-box
    privileged: true
    init: true
    stop_grace_period: 90s
    env_file:
      - path: .env
        required: false
    environment:
      NOMAD_SEARCH_URL: http://${NOMAD_HOST:-localhost}:${NOMAD_SEARCH_PORT:-8070}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${NOMAD_PORT:-8080}:8080
      - 8090:8090
      - 8100:8100
      - 8200:8200
      - 8310:8310
      - 8400-8500:8400-8500
      - 9999:9999
    volumes:
      - ${NOMAD_DATA_DIR:-./data}:/opt/project-nomad
      - nomad-engine:/var/lib/docker
      - ./content:/opt/nomad-box/content:ro

  # Embeddings on this machine (nomic-embed-text, the model NOMAD indexes with), for Knowledge Search
  embed:
    <<: *defaults
    build: embed
    image: nomad-embed:b11459
    container_name: nomad-embed
    command: [--hf-repo, nomic-ai/nomic-embed-text-v1.5-GGUF, --hf-file, nomic-embed-text-v1.5.f16.gguf,
              --embeddings, --pooling, mean, --ctx-size, "2048", --ubatch-size, "2048", --host, 0.0.0.0, --port, "8080"]
    environment:
      LLAMA_CACHE: /models
    volumes:
      - ${NOMAD_DATA_DIR:-./data}/models:/models

  # Knowledge Search page, and tools (Wikipedia, knowledge base, notes) for NOMAD's chat
  search:
    <<: *defaults
    image: python:3.13-alpine
    container_name: nomad-search
    command: [python, /app/server.py]
    environment:
      LLM_URL: ${NOMAD_LLM_URL:-http://localhost:11434}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${NOMAD_SEARCH_PORT:-8070}:8070
    volumes:
      - ./search:/app:ro

  proxy:
    <<: *defaults
    image: caddy:2.10-alpine
    container_name: nomad-proxy
    profiles:
      - https
    command: caddy run --config /data/Caddyfile --adapter caddyfile --watch
    depends_on:
      nomad:
        condition: service_healthy
    ports:
      - ${NOMAD_HTTPS_PORT:-443}:443
    volumes:
      - ${NOMAD_DATA_DIR:-./data}/caddy:/data

volumes:
  nomad-engine:
