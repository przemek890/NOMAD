# Debian 13 automatic install for a NOMAD mini PC: whole disk (/dev/sda), no desktop, SSH key login only.
# Replace @SSH_KEY@ with your public key (cat ~/.ssh/id_ed25519.pub). Boot the Debian installer with
#   auto=true priority=critical url=http://10.77.0.1:8765/preseed.cfg
# while the computer running the model serves this file: python3 -m http.server 8765 --bind 10.77.0.1
# ERASES THE WHOLE DISK of the mini PC.
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string PL
d-i keyboard-configuration/xkb-keymap select pl
d-i netcfg/choose_interface select auto
d-i netcfg/dhcp_timeout string 60
d-i netcfg/get_hostname string nomad
d-i netcfg/get_domain string
d-i netcfg/hostname string nomad
d-i hw-detect/load_firmware boolean true

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string NOMAD
d-i passwd/username string nomad
d-i passwd/user-password-crypted password !

d-i clock-setup/utc boolean true
d-i time/zone string Europe/Warsaw
d-i clock-setup/ntp boolean true

d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-auto/expert_recipe string nomad :: \
  512 512 512 free $iflabel{ gpt } $reusemethod{ } method{ efi } format{ } . \
  4000 10000 -1 ext4 $primary{ } method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ / } .
d-i partman-auto/choose_recipe select nomad
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean false
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo curl ca-certificates git make jq zram-tools firmware-realtek firmware-amd-graphics
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default
d-i grub-installer/force-efi-extra-removable boolean true

d-i preseed/late_command string in-target sh -c 'install -d -m 700 -o nomad -g nomad /home/nomad/.ssh; echo "@SSH_KEY@" > /home/nomad/.ssh/authorized_keys; chown nomad:nomad /home/nomad/.ssh/authorized_keys; chmod 600 /home/nomad/.ssh/authorized_keys; echo "nomad ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/nomad; chmod 440 /etc/sudoers.d/nomad; printf "ALGO=zstd\nPERCENT=50\nPRIORITY=100\n" > /etc/default/zramswap; printf "PasswordAuthentication no\n" > /etc/ssh/sshd_config.d/nomad.conf; systemctl set-default multi-user.target'; true
d-i finish-install/reboot_in_progress note
